version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: circuit_arena_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auction
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
